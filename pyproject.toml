[project]
name = "oop"
version = "0.1.0"
description = ""
authors = [
    {name = "LexaNovikov",email = "lexaproxa228@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "cov (>=0.1.2,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
exclude = '''
(
    /(
        \.venv
        \.poetry.lock
        \.pyproject.toml
        \.flake8
        \src/__init__.py
        \tests/__init__.py
    )/
)'''
[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.venv
        \.poetry.lock
        \.pyproject.toml
        \.flake8
        \src/__init__.py
        \tests/__init__.py
    )/
)'''
[tool.isort]
line_length = 119
